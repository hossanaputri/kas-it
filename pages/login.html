<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT-Kas - Login</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0a1a0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IT-Kas">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
</head>
<body class="login-page">

<!-- Theme toggle -->
<button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
  <span id="theme-icon">🌙</span>
</button>

<!-- Background orbs -->
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="login-wrapper">
  <div class="login-card" id="app">
    <div class="logo-container"><img src="../icons/icon-192.png" alt="IT-Kas" class="logo-img"></div>
    <h1>IT-Kas</h1>

    <!-- Login Form -->
    <template v-if="!showChangePassword">
      <div v-if="sessionExpired" class="session-expired-banner">
        ⏱️ Sesi kamu sudah habis. Silakan login ulang.
      </div>

      <div class="form-group">
        <label>NIK</label>
        <input type="text" v-model="nik" placeholder="Masukkan NIK" @keyup.enter="login">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input :type="showPass ? 'text' : 'password'" v-model="password" placeholder="Masukkan Password" @keyup.enter="login">
          <span class="eye-toggle" @click="showPass = !showPass">
            <svg v-if="!showPass" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg v-else width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </span>
        </div>
      </div>

      <button class="btn btn-primary btn-block btn-shimmer" @click="login" :disabled="loading">
        {{ loading ? 'Memproses...' : 'Masuk' }}
      </button>
    </template>

    <!-- Change Password Form -->
    <template v-else>
      <div class="subtitle change-pw-warning">⚠️ Buat password baru untuk akun kamu</div>

      <div class="form-group">
        <label>Password Baru</label>
        <div class="password-wrapper">
          <input :type="showNewPass ? 'text' : 'password'" v-model="newPassword" placeholder="Minimal 4 karakter" @keyup.enter="$refs.confirmInput.focus()">
          <span class="eye-toggle" @click="showNewPass = !showNewPass">
            <svg v-if="!showNewPass" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg v-else width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </span>
        </div>
      </div>
      <div class="form-group">
        <label>Konfirmasi Password</label>
        <div class="password-wrapper">
          <input :type="showConfirmPass ? 'text' : 'password'" v-model="confirmPassword" placeholder="Ketik ulang password" ref="confirmInput" @keyup.enter="changePassword">
          <span class="eye-toggle" @click="showConfirmPass = !showConfirmPass">
            <svg v-if="!showConfirmPass" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg v-else width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </span>
        </div>
      </div>

      <button class="btn btn-primary btn-block btn-shimmer" @click="changePassword" :disabled="loading">
        {{ loading ? 'Menyimpan...' : 'Simpan Password' }}
      </button>
    </template>

    <div class="error-msg" :class="{ show: errorMsg }">{{ errorMsg }}</div>

    <div class="divider"></div>
    <div class="footer-text">IT-Kas &copy; 2026</div>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="../js/auth.js"></script>
<script>
// Theme management
function initTheme() {
  const saved = localStorage.getItem('kas-it-theme') || 'light';
  applyTheme(saved);
}
function applyTheme(theme) {
  if (theme === 'light') {
    document.body.classList.add('light');
  } else {
    document.body.classList.remove('light');
  }
  const icon = document.getElementById('theme-icon');
  if (icon) icon.textContent = theme === 'light' ? '☀️' : '🌙';
}
function toggleTheme() {
  const current = localStorage.getItem('kas-it-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('kas-it-theme', next);
  applyTheme(next);
}
initTheme();
</script>
<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      nik: '',
      password: '',
      loading: false,
      errorMsg: '',
      sessionExpired: new URLSearchParams(window.location.search).has('expired'),
      showChangePassword: false,
      newPassword: '',
      confirmPassword: '',
      pendingToken: '',
      showPass: false,
      showNewPass: false,
      showConfirmPass: false
    };
  },
  mounted() {
    const token = sessionStorage.getItem('kas-it-token');
    if (token) {
      this.verifyAndRedirect(token);
    }
  },
  methods: {
    async verifyAndRedirect(token) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'verifyToken', token })
        });
        const result = await res.json();
        if (result.valid) {
          window.location.href = 'index.html';
        } else {
          sessionStorage.removeItem('kas-it-token');
        }
      } catch (err) {}
    },

    async login() {
      if (!this.nik.trim() || !this.password.trim()) {
        this.errorMsg = 'NIK dan password wajib diisi';
        return;
      }
      this.loading = true;
      this.errorMsg = '';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          redirect: 'follow',
          body: JSON.stringify({
            action: 'login',
            nik: this.nik.trim(),
            password: this.password
          })
        });
        const text = await res.text();
        let result;
        try { result = JSON.parse(text); } catch(e) { this.errorMsg = 'Server error: response bukan JSON'; return; }
        if (result.token) {
          if (result.mustChangePassword) {
            this.pendingToken = result.token;
            this.showChangePassword = true;
            this.errorMsg = '';
            sessionStorage.setItem('kas-it-token', result.token);
            sessionStorage.setItem('kas-it-login-time', String(Date.now()));
            sessionStorage.setItem('kas-it-member-nik', result.memberNik || '');
            sessionStorage.setItem('kas-it-member-name', result.memberName || '');
            sessionStorage.setItem('kas-it-is-admin', result.isAdmin ? 'true' : 'false');
          } else {
            sessionStorage.setItem('kas-it-token', result.token);
            sessionStorage.setItem('kas-it-login-time', String(Date.now()));
            sessionStorage.setItem('kas-it-member-nik', result.memberNik || '');
            sessionStorage.setItem('kas-it-member-name', result.memberName || '');
            sessionStorage.setItem('kas-it-is-admin', result.isAdmin ? 'true' : 'false');
            window.location.href = 'index.html';
          }
        } else {
          this.errorMsg = result.error || 'Login gagal';
        }
      } catch (err) {
        console.error('Login error:', err);
        this.errorMsg = 'Gagal konek ke server: ' + err.message;
      } finally {
        this.loading = false;
      }
    },

    async changePassword() {
      if (!this.newPassword || this.newPassword.length < 4) {
        this.errorMsg = 'Password minimal 4 karakter';
        return;
      }
      if (this.newPassword !== this.confirmPassword) {
        this.errorMsg = 'Password tidak sama';
        return;
      }
      this.loading = true;
      this.errorMsg = '';

      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(this.newPassword);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'changePassword',
            token: this.pendingToken,
            memberNik: sessionStorage.getItem('kas-it-member-nik') || '',
            newPasswordHash: hashHex
          })
        });
        const result = await res.json();
        if (result.ok !== false) {
          window.location.href = 'index.html';
        } else {
          this.errorMsg = result.error || 'Gagal menyimpan password';
        }
      } catch (err) {
        this.errorMsg = 'Gagal konek ke server';
      } finally {
        this.loading = false;
      }
    }
  }
}).mount('#app');
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../sw.js');
}
</script>
</body>
</html>
