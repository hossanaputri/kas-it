<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAS IT v2 - Login</title>
<link rel="stylesheet" href="/css/styles.css">
<style>
/* Page-specific: login.html */
body { display: flex; align-items: center; justify-content: center; }
.login-card { background: white; border-radius: var(--radius-xl); padding: 40px; width: 90%; max-width: 360px; box-shadow: var(--shadow-md); text-align: center; }
.login-card .logo { font-size: 48px; margin-bottom: 8px; }
.login-card h1 { font-size: 20px; color: var(--text); margin-bottom: 4px; }
.login-card .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
.form-group { text-align: left; margin-bottom: 14px; }
.form-group input { padding: 11px 14px; border-radius: 10px; }
.btn-login { width: 100%; padding: 12px; background: var(--primary-gradient); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
.btn-login:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(90,184,98,0.3); }
.btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
.error-msg { color: var(--red); font-size: 12px; margin-top: 12px; display: none; }
.error-msg.show { display: block; }
</style>
</head>
<body>

<div class="login-card" id="app">
  <div class="logo">💰</div>
  <h1>KAS IT Dashboard</h1>

  <!-- Login Form -->
  <template v-if="!showChangePassword">
    <div v-if="sessionExpired" style="background:#fff3e0;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:#e65100;font-weight:500;">
      ⏱️ Sesi kamu sudah habis. Silakan login ulang.
    </div>
    <div class="subtitle">Silakan login untuk melanjutkan</div>

    <div class="form-group">
      <label>NIK</label>
      <input type="text" v-model="nik" placeholder="Masukkan NIK" @keyup.enter="login">
    </div>
    <div class="form-group">
      <label>Password</label>
      <div style="position:relative;">
        <input :type="showPass ? 'text' : 'password'" v-model="password" placeholder="Password" @keyup.enter="login" style="padding-right:40px;">
        <span @click="showPass = !showPass" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;user-select:none;display:flex;align-items:center;">
          <svg v-if="!showPass" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg v-else width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </span>
      </div>
    </div>

    <button class="btn-login" @click="login" :disabled="loading">
      {{ loading ? 'Memproses...' : 'Login' }}
    </button>
  </template>

  <!-- Change Password Form -->
  <template v-else>
    <div class="subtitle" style="color:#e65100;">⚠️ Buat password baru untuk akun kamu</div>

    <div class="form-group">
      <label>Password Baru</label>
      <div style="position:relative;">
        <input :type="showNewPass ? 'text' : 'password'" v-model="newPassword" placeholder="Minimal 4 karakter" @keyup.enter="$refs.confirmInput.focus()" style="padding-right:40px;">
        <span @click="showNewPass = !showNewPass" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;user-select:none;display:flex;align-items:center;">
          <svg v-if="!showNewPass" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg v-else width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </span>
      </div>
    </div>
    <div class="form-group">
      <label>Konfirmasi Password</label>
      <div style="position:relative;">
        <input :type="showConfirmPass ? 'text' : 'password'" v-model="confirmPassword" placeholder="Ketik ulang password" ref="confirmInput" @keyup.enter="changePassword" style="padding-right:40px;">
        <span @click="showConfirmPass = !showConfirmPass" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;user-select:none;display:flex;align-items:center;">
          <svg v-if="!showConfirmPass" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg v-else width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </span>
      </div>
    </div>

    <button class="btn-login" @click="changePassword" :disabled="loading">
      {{ loading ? 'Menyimpan...' : 'Simpan Password' }}
    </button>
  </template>

  <div class="error-msg" :class="{ show: errorMsg }">{{ errorMsg }}</div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/js/auth.js"></script>
<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      nik: '',
      password: '',
      loading: false,
      errorMsg: '',
      sessionExpired: new URLSearchParams(window.location.search).has('expired'),
      // Change password
      showChangePassword: false,
      newPassword: '',
      confirmPassword: '',
      pendingToken: '',
      // Eye toggles
      showPass: false,
      showNewPass: false,
      showConfirmPass: false
    };
  },
  mounted() {
    // If already has valid token, redirect
    const token = sessionStorage.getItem('kas-it-token');
    if (token) {
      this.verifyAndRedirect(token);
    }
  },
  methods: {
    async verifyAndRedirect(token) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'verifyToken', token })
        });
        const result = await res.json();
        if (result.valid) {
          window.location.href = 'index.html';
        } else {
          sessionStorage.removeItem('kas-it-token');
        }
      } catch (err) {
        // Token check failed, stay on login
      }
    },

    async login() {
      if (!this.nik.trim() || !this.password.trim()) {
        this.errorMsg = 'NIK dan password wajib diisi';
        return;
      }
      this.loading = true;
      this.errorMsg = '';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          redirect: 'follow',
          body: JSON.stringify({
            action: 'login',
            nik: this.nik.trim(),
            password: this.password
          })
        });
        const text = await res.text();
        let result;
        try { result = JSON.parse(text); } catch(e) { this.errorMsg = 'Server error: response bukan JSON'; return; }
        if (result.token) {
          // Check if must change password
          if (result.mustChangePassword) {
            this.pendingToken = result.token;
            this.showChangePassword = true;
            this.errorMsg = '';
            // Store session temporarily (needed for changePassword API)
            sessionStorage.setItem('kas-it-token', result.token);
            sessionStorage.setItem('kas-it-login-time', String(Date.now()));
            sessionStorage.setItem('kas-it-member-nik', result.memberNik || '');
            sessionStorage.setItem('kas-it-member-name', result.memberName || '');
            sessionStorage.setItem('kas-it-is-admin', result.isAdmin ? 'true' : 'false');
          } else {
            sessionStorage.setItem('kas-it-token', result.token);
            sessionStorage.setItem('kas-it-login-time', String(Date.now()));
            sessionStorage.setItem('kas-it-member-nik', result.memberNik || '');
            sessionStorage.setItem('kas-it-member-name', result.memberName || '');
            sessionStorage.setItem('kas-it-is-admin', result.isAdmin ? 'true' : 'false');
            window.location.href = 'index.html';
          }
        } else {
          this.errorMsg = result.error || 'Login gagal';
        }
      } catch (err) {
        console.error('Login error:', err);
        this.errorMsg = 'Gagal konek ke server: ' + err.message;
      } finally {
        this.loading = false;
      }
    },

    async changePassword() {
      if (!this.newPassword || this.newPassword.length < 4) {
        this.errorMsg = 'Password minimal 4 karakter';
        return;
      }
      if (this.newPassword !== this.confirmPassword) {
        this.errorMsg = 'Password tidak sama';
        return;
      }
      this.loading = true;
      this.errorMsg = '';

      try {
        // Hash password client-side (SHA-256)
        const encoder = new TextEncoder();
        const data = encoder.encode(this.newPassword);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'changePassword',
            token: this.pendingToken,
            memberNik: sessionStorage.getItem('kas-it-member-nik') || '',
            newPasswordHash: hashHex
          })
        });
        const result = await res.json();
        if (result.ok !== false) {
          window.location.href = 'index.html';
        } else {
          this.errorMsg = result.error || 'Gagal menyimpan password';
        }
      } catch (err) {
        this.errorMsg = 'Gagal konek ke server';
      } finally {
        this.loading = false;
      }
    }
  }
}).mount('#app');
</script>
</body>
</html>
